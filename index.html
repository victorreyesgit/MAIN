<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAIN · victorreyesgit</title>
<style>
:root {
  --bg: #eef1f7; --bg2: #e3e8f2; --surface: #ffffff; --ink: #121830; --muted: #566082;
  --line: #d3d9e8; --accent: #b45309; --accent-ink: #ffffff; --accent-soft: #fdeed8; --live: #15803d;
  --grid: rgba(18,24,48,.05);
  --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0a0d1c; --bg2: #11163a; --surface: #131838; --ink: #eef0fa; --muted: #98a1c4;
  --line: #262e5c; --accent: #ffb454; --accent-ink: #1a1203; --accent-soft: #2a2441; --live: #4ade80;
  --grid: rgba(150,165,255,.06);
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-family: var(--font); line-height: 1.5; min-height: 100vh;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 36px 36px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 36px 36px,
    radial-gradient(900px 420px at 85% -10%, var(--bg2), transparent 70%),
    var(--bg); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 1.25rem; }
header { padding: 2.4rem 0 1.4rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
h1 { margin: 0; font-size: clamp(3rem, 12vw, 5.2rem); letter-spacing: .12em; line-height: .95; font-weight: 800; }
h1 span { color: var(--accent); }
.sub { margin: .7rem 0 0; color: var(--muted); }
.btn { font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: .45rem .8rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; text-decoration: none; display: inline-block; }

/* Portals */
.portals { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-bottom: 1rem; }
.portal { padding: 1.2rem 1.3rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  display: flex; flex-direction: column; gap: .6rem; position: relative; overflow: hidden; }
.portal::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); }
.portal:hover { border-color: var(--accent); }
.portal h2 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: .6rem; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); flex: none; }
.dot.live { background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.55); } 70%,100% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } }
.portal p { margin: 0; color: var(--muted); font-size: .93rem; }
.portal .url { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem; }

/* Controls */
.controls { display: grid; gap: .9rem; padding: 1.1rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; margin-bottom: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; }
.row > .grow { flex: 1 1 240px; }
.lbl { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; font-weight: 600; }
input[type="search"], select { font: inherit; padding: .55rem .75rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; }
input[type="search"] { width: 100%; }
label.check { display: flex; align-items: center; gap: .4rem; font-size: .9rem; color: var(--muted); padding-bottom: .5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { font: inherit; font-size: .85rem; padding: .28rem .75rem; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
  color: var(--ink); background: transparent; border: 1px solid var(--line); }
.chip:hover { border-color: var(--accent); }
.chip i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip small { opacity: .7; }

/* List */
.count { margin: 0 0 .6rem; color: var(--muted); font-size: .9rem; }
.list { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; gap: .55rem; }
details { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--muted)); border-radius: 12px; }
details:hover { border-color: var(--accent); border-left-color: var(--c, var(--muted)); }
details[open] { border-color: var(--accent); border-left-color: var(--c, var(--muted)); }
summary { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .75rem; padding: .85rem 1rem; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; color: var(--muted); }
details[open] summary::before { content: "▾"; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.labels { margin-left: auto; display: flex; gap: .35rem; flex-wrap: wrap; }
.tag { font-size: .75rem; padding: .05rem .55rem; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
.links { display: grid; gap: .6rem; padding: 0 1rem 1rem 2.1rem; }
.links a { color: var(--accent); overflow-wrap: anywhere; }
.links .k { display: block; font-size: .8rem; color: var(--muted); }
.links .none { color: var(--muted); font-size: .9rem; }
.msg { padding: 2rem 1.25rem; text-align: center; background: var(--surface); border: 1px dashed var(--line);
  border-radius: 12px; color: var(--muted); margin-bottom: 3rem; }
.msg strong { color: var(--ink); display: block; margin-bottom: .3rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>MAIN<span>.</span></h1>
      <p class="sub">My projects, in one place.</p>
    </div>
    <button class="btn" id="theme" type="button">Light mode</button>
  </header>

  <main>
    <section class="portals" id="portals" aria-label="My sites"></section>

    <section class="controls" aria-label="Search and filters">
      <div class="row">
        <div class="grow">
          <label for="q" class="lbl">Search</label>
          <input type="search" id="q" placeholder="Repository name" autocomplete="off">
        </div>
        <div>
          <label for="sort" class="lbl">Sort by</label>
          <select id="sort">
            <option value="updated">Recently updated</option>
            <option value="name">Name (A–Z)</option>
            <option value="access">Access</option>
            <option value="category">Category</option>
            <option value="status">Status</option>
          </select>
        </div>
      </div>
      <div><span class="lbl">Access</span><div class="chips" id="f-access"></div></div>
      <div><span class="lbl">Category</span><div class="chips" id="f-cat"></div></div>
      <div><span class="lbl">Status</span><div class="chips" id="f-status"></div></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="forks"> Show forks</label>
        <button class="btn" id="reset" type="button">Reset filters</button>
      </div>
    </section>

    <p class="count" id="shown" aria-live="polite"></p>
    <div id="state" class="msg" hidden></div>
    <ul class="list" id="list"></ul>
  </main>
</div>

<script>
"use strict";
const USER = "victorreyesgit";

// Your two sites. They are checked automatically every time MAIN loads.
const PORTALS = [
  { name: "Personal Projects", url: "https://victorreyesgit.github.io/Home/" },
  { name: "Research", url: "https://victorreyesgit.github.io/Portfolio/" }
];

// Topic convention: access-<value> and category-<value> on each GitHub repo.
const ACCESS = [
  { key: "home",      label: "Home",      color: "#3fcf8e" },
  { key: "portfolio", label: "Portfolio", color: "#a78bfa" },
  { key: "other",     label: "Other",     color: "#8b93ad" },
  { key: "none",      label: "None",      color: "#8b93ad" }
];
const STATUS = [
  { key: "done",        label: "Done" },
  { key: "in-progress", label: "In progress" },
  { key: "idea",        label: "Idea" },          // just the basic idea, not started yet
  { key: "abandoned",   label: "Abandoned" },
  { key: "none",        label: "None" }
];
const CATEGORY = [
  { key: "projects",   label: "Projects",   color: "#3fcf8e" },
  { key: "research",   label: "Research",   color: "#a78bfa" },
  { key: "playground", label: "Playground", color: "#ffb454" },
  { key: "other",      label: "Other",      color: "#8b93ad" }
];

let repos = [];
const state = { q: "", sort: "updated", forks: false, access: new Set(), cats: new Set(), status: new Set() };
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// ---------- Theme (dark by default) ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
}
(function () {
  let t = "light";
  try { t = localStorage.getItem("main-theme") || "light"; } catch (e) {}
  applyTheme(t);
})();
$("theme").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("main-theme", t); } catch (e) {}
});

// ---------- Portals: Home and Portfolio ----------

async function loadPortal(p, dot, desc) {
  try {
    const res = await fetch(p.url, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const meta = doc.querySelector('meta[name="description"]');
    desc.textContent = (meta && meta.content) || doc.title || "Site is online.";
    dot.classList.add("live");
    dot.title = "Online";
  } catch (e) {
    desc.textContent = "Couldn't check this site right now. You can still open it.";
  }
}
function buildPortals() {
  for (const p of PORTALS) {
    const card = el("article", "portal");
    const h = el("h2");
    const dot = el("span", "dot");
    h.append(dot, document.createTextNode(p.name));
    const desc = el("p", "", "Checking…");
    const url = el("div", "url", p.url);
    const actions = el("div", "actions");
    const open = el("a", "btn primary", "Open " + p.name);
    open.href = p.url; open.target = "_blank"; open.rel = "noopener noreferrer";
    actions.append(open);
    card.append(h, desc, url, actions);
    $("portals").append(card);
    loadPortal(p, dot, desc);
  }
}
buildPortals();

// ---------- Fetch all repos (paginated) ----------
async function fetchAllRepos() {
  const all = [];
  for (let page = 1; page <= 20; page++) {
    const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&type=owner`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) { const e = new Error("GitHub " + res.status); e.status = res.status; e.reset = res.headers.get("x-ratelimit-reset"); throw e; }
    const batch = await res.json();
    all.push(...batch);
    if (batch.length < 100) break;
  }
  return all;
}

// ---------- Helpers ----------
function pick(repo, prefix, list, fallback) {
  const topics = repo.topics || [];
  return list.find(o => topics.includes(prefix + o.key)) || list.find(o => o.key === fallback);
}
const accessOf = r => pick(r, "access-", ACCESS, "none");
const categoryOf = r => pick(r, "category-", CATEGORY, "other");
const statusOf = r => pick(r, "status-", STATUS, "none");
function pagesUrl(r) {
  if (r.homepage && /^https?:\/\//i.test(r.homepage)) return r.homepage;
  if (r.has_pages) {
    const root = r.name.toLowerCase() === (USER + ".github.io").toLowerCase();
    return `https://${USER.toLowerCase()}.github.io/` + (root ? "" : r.name + "/");
  }
  return null;
}
const baseRepos = () => repos.filter(r => state.forks || !r.fork);

// ---------- Chips ----------
function buildChips(container, options, set, countFn) {
  container.replaceChildren();
  for (const o of options) {
    const b = el("button", "chip");
    b.type = "button";
    if (o.color) { const i = el("i"); i.style.setProperty("--c", o.color); b.append(i); }
    b.append(document.createTextNode(o.label), el("small", "", String(countFn(o.key))));
    b.setAttribute("aria-pressed", set.has(o.key) ? "true" : "false");
    b.addEventListener("click", () => {
      if (set.has(o.key)) set.delete(o.key); else set.add(o.key);
      b.setAttribute("aria-pressed", set.has(o.key) ? "true" : "false");
      render();
    });
    container.append(b);
  }
}
function buildAllChips() {
  const list = baseRepos();
  buildChips($("f-access"), ACCESS, state.access, k => list.filter(r => accessOf(r).key === k).length);
  buildChips($("f-status"), STATUS, state.status, k => list.filter(r => statusOf(r).key === k).length);
  buildChips($("f-cat"), CATEGORY, state.cats, k => list.filter(r => categoryOf(r).key === k).length);
}

// ---------- Filter + sort ----------
function visibleRepos() {
  const q = state.q.trim().toLowerCase();
  const out = baseRepos().filter(r =>
    (!q || r.name.toLowerCase().includes(q)) &&
    (!state.access.size || state.access.has(accessOf(r).key)) &&
    (!state.status.size || state.status.has(statusOf(r).key)) &&
    (!state.cats.size || state.cats.has(categoryOf(r).key)));
  const idx = (list, key) => list.findIndex(o => o.key === key);
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (state.sort === "name") out.sort(byName);
  else if (state.sort === "access") out.sort((a, b) => idx(ACCESS, accessOf(a).key) - idx(ACCESS, accessOf(b).key) || byName(a, b));
  else if (state.sort === "category") out.sort((a, b) => idx(CATEGORY, categoryOf(a).key) - idx(CATEGORY, categoryOf(b).key) || byName(a, b));
  else if (state.sort === "status") out.sort((a, b) => idx(STATUS, statusOf(a).key) - idx(STATUS, statusOf(b).key) || byName(a, b));
  else out.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  return out;
}

// ---------- Render ----------
function linkBlock(title, url) {
  const d = el("div");
  d.append(el("span", "k", title));
  const a = el("a", "", url);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  d.append(a);
  return d;
}
function rowFor(r) {
  const li = el("li");
  const det = el("details");
  det.style.setProperty("--c", categoryOf(r).color);
  const sum = el("summary");
  sum.append(el("span", "name", r.name));
  const labels = el("span", "labels");
  labels.append(el("span", "tag", "Access: " + accessOf(r).label), el("span", "tag", "Status: " + statusOf(r).label), el("span", "tag", "Category: " + categoryOf(r).label));
  sum.append(labels);
  det.append(sum);
  const links = el("div", "links");
  const p = pagesUrl(r);
  if (p) links.append(linkBlock("Pages link", p)); else links.append(el("span", "none", "No Pages link"));
  links.append(linkBlock("Repository", r.html_url));
  det.append(links);
  li.append(det);
  return li;
}
function showState(title, text) {
  const s = $("state");
  s.replaceChildren(el("strong", "", title), document.createTextNode(text));
  s.hidden = false;
}
function render() {
  const list = visibleRepos(), total = baseRepos().length;
  $("list").replaceChildren(...list.map(rowFor));
  $("shown").textContent = `Showing ${list.length} of ${total} repositories`;
  if (!list.length) showState("No projects match.", total ? "Remove a filter or use Reset filters." : "No repositories found.");
  else $("state").hidden = true;
}

// ---------- Controls ----------
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("forks").addEventListener("change", e => { state.forks = e.target.checked; buildAllChips(); render(); });
$("reset").addEventListener("click", () => {
  state.q = ""; state.sort = "updated"; state.forks = false; state.access.clear(); state.cats.clear(); state.status.clear();
  $("q").value = ""; $("sort").value = "updated"; $("forks").checked = false;
  buildAllChips(); render();
});

// ---------- Start ----------
(async function init() {
  showState("Loading your repositories…", "Asking GitHub for the list.");
  try {
    repos = await fetchAllRepos();
    $("state").hidden = true;
    buildAllChips();
    render();
  } catch (err) {
    $("shown").textContent = "";
    if (err.status === 403 || err.status === 429) {
      const when = err.reset ? " It resets around " + new Date(err.reset * 1000).toLocaleTimeString() + "." : "";
      showState("GitHub's rate limit was reached.", "Reload later." + when);
    } else {
      showState("Couldn't load repositories.", "Check your connection and reload. GitHub's API may be down.");
    }
  }
})();
</script>
</body>
</html>
